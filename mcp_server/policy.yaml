# SLOs and guardrails the agent must satisfy. Visible to the agent via get_policy().
# Calibrated on the real fleet (Lightning AI, GCP, 1 x NVIDIA L4 per node, Qwen2.5-7B-Instruct, vLLM 0.30,
# KV cache 51,936 tokens). Measured p95 TTFT / p95 e2e / goodput under these SLOs:
#   healthy (~5% long prompts)                    2.5 s /  21 s / 99.5%  -> passes
#   incident, 0.6 rps ~50% long, prod config      14.8 s /  54 s /  41%  -> fails
#   same traffic, max_num_seqs 16 + prefix cache   6.8 s /  28 s / 100%  -> passes
#   incident at 1.0 rps, even with that fix        9.4 s /  47 s /  74%  -> fails (a capacity problem)
# On an L4 one 8-10k-token prefill alone takes ~3 s, so TTFT targets below ~8 s are unrealistic with
# long-context traffic; e2e is dominated by answer length (~15-18 tokens/s per request).

slos:
  p95_ttft_ms:   {max: 8000}   # time to first token, all requests
  p95_e2e_ms:    {max: 40000}  # end-to-end latency, all requests
  error_rate:    {max: 0.01}   # errors + timeouts + requests cancelled after drain
  goodput_ratio: {min: 0.90}   # share of offered requests completed within the TTFT and e2e limits

quality:
  # Golden long-context prompts with exact answers (needle codes). Any change to KV-cache
  # precision must be quality-checked before it can reach production.
  min_accuracy: 0.95
  max_drop_vs_baseline: 0.025

evidence:
  # apply_production_config refuses unless a shadow load test of the exact candidate config
  # passed every SLO on production traffic captured recently, at >= real rate.
  max_age_minutes: 90
  min_duration_s: 45
  min_rate_multiplier: 1.0

analysis:
  long_prompt_threshold_tokens: 2000

constraints:
  - The served model (Qwen/Qwen2.5-7B-Instruct) is fixed; only serving knobs may change.
  - Production changes restart the live vLLM process and require human approval.
  - Experiments run only on the shadow GPU, never against production.
